<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Libertas escrow platform cockpit</title>
  <desc id="desc">A premium platform dashboard showing funded escrow tranches, validation evidence, code review, UAT, and go-live confidence.</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#151719"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#e1261c"/>
      <stop offset=".52" stop-color="#86bc25"/>
      <stop offset="1" stop-color="#a100ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#050505" flood-opacity=".26"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect x="38" y="34" width="1124" height="692" rx="10" fill="url(#screen)" filter="url(#shadow)"/>
  <rect x="38" y="34" width="1124" height="7" fill="url(#accent)"/>
  <rect x="72" y="70" width="1056" height="76" rx="6" fill="#ffffff" opacity=".07"/>
  <rect x="96" y="96" width="22" height="22" rx="3" fill="#e1261c"/>
  <rect x="128" y="96" width="22" height="22" rx="3" fill="#86bc25"/>
  <rect x="160" y="96" width="22" height="22" rx="3" fill="#a100ff"/>
  <text x="210" y="118" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Libertas Escrow Platform</text>
  <text x="880" y="116" fill="#b9bec5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650">Release request: Tranche 03</text>

  <rect x="76" y="180" width="310" height="232" rx="8" fill="#ffffff"/>
  <rect x="76" y="180" width="310" height="7" fill="#e1261c"/>
  <text x="106" y="228" fill="#050505" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">Escrow Funding</text>
  <text x="106" y="268" fill="#62666b" font-family="Segoe UI, Arial, sans-serif" font-size="15">Deposited capital</text>
  <text x="106" y="320" fill="#050505" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="900">$4.8M</text>
  <rect x="106" y="350" width="226" height="14" rx="7" fill="#e7e9ec"/>
  <rect x="106" y="350" width="166" height="14" rx="7" fill="#86bc25"/>
  <text x="106" y="392" fill="#62666b" font-family="Segoe UI, Arial, sans-serif" font-size="14">Tranches funded before work is released.</text>

  <rect x="420" y="180" width="336" height="232" rx="8" fill="#ffffff"/>
  <rect x="420" y="180" width="336" height="7" fill="#86bc25"/>
  <text x="450" y="228" fill="#050505" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">Validation Evidence</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <rect x="450" y="258" width="16" height="16" rx="3" fill="#86bc25"/>
    <text x="480" y="272" fill="#252525">Requirements crosswalk complete</text>
    <rect x="450" y="306" width="16" height="16" rx="3" fill="#86bc25"/>
    <text x="480" y="320" fill="#252525">UAT scenarios mapped to obligations</text>
    <rect x="450" y="354" width="16" height="16" rx="3" fill="#e1261c"/>
    <text x="480" y="368" fill="#252525">Code review issue: integration logging</text>
  </g>

  <rect x="790" y="180" width="338" height="232" rx="8" fill="#ffffff"/>
  <rect x="790" y="180" width="338" height="7" fill="#a100ff"/>
  <text x="820" y="228" fill="#050505" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">Go-Live Confidence</text>
  <circle cx="948" cy="308" r="78" fill="#eff1f2"/>
  <path d="M948 230a78 78 0 1 1-63 124" fill="none" stroke="#86bc25" stroke-width="18" stroke-linecap="square"/>
  <path d="M948 230a78 78 0 0 1 63 32" fill="none" stroke="#a100ff" stroke-width="18" stroke-linecap="square"/>
  <text x="914" y="322" fill="#050505" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="900">91</text>
  <text x="1010" y="322" fill="#62666b" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650">threshold met</text>

  <rect x="76" y="454" width="1052" height="176" rx="8" fill="#ffffff" opacity=".08"/>
  <text x="106" y="504" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Release Rule Timeline</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#ffffff">
    <line x1="126" x2="1060" y1="560" y2="560" stroke="#555b62" stroke-width="4"/>
    <rect x="112" y="546" width="28" height="28" rx="3" fill="#e1261c"/>
    <text x="96" y="604">Contract</text>
    <rect x="304" y="546" width="28" height="28" rx="3" fill="#86bc25"/>
    <text x="292" y="604">Fund</text>
    <rect x="496" y="546" width="28" height="28" rx="3" fill="#86bc25"/>
    <text x="478" y="604">Validate</text>
    <rect x="688" y="546" width="28" height="28" rx="3" fill="#a100ff"/>
    <text x="680" y="604">Review</text>
    <rect x="880" y="546" width="28" height="28" rx="3" fill="#0b6fce"/>
    <text x="862" y="604">Score</text>
    <rect x="1050" y="546" width="28" height="28" rx="3" fill="#ffffff"/>
    <text x="1034" y="604">Release</text>
  </g>
</svg>
